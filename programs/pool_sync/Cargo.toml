[package]
name = "pool_sync"
version = "0.1.0"
description = "PoolSync: Atomic Multi-Pool Constant-Product AMM Rebalance"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pool_sync"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["mint", "token"] }
