[workspace]
members = [
    "programs/*"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[patch.crates-io]
anchor-syn = { path = "vendor/anchor-syn" }
blake3 = { path = "vendor/blake3" }
indexmap = { path = "vendor/indexmap" }
proc-macro-crate = { path = "vendor/proc-macro-crate" }
zeroize_derive = { path = "vendor/zeroize_derive" }
